<script>
        // Simple Intersection Observer for scroll reveal effect
        document.addEventListener("DOMContentLoaded", () => {
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.1
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.image-reveal').forEach(element => {
                observer.observe(element);
            });
        });
    </script>

<!-- Lightbox -->
<div id="lightbox" class="fixed inset-0 z-[100] bg-background/95 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center backdrop-blur-sm">
    <button onclick="closeLightbox()" class="absolute top-8 right-8 text-primary hover:text-secondary transition-colors z-[110]">
        <span class="material-symbols-outlined text-[32px]">close</span>
    </button>
    
    <button onclick="prevImage(event)" class="absolute left-4 md:left-8 top-1/2 -translate-y-1/2 text-primary hover:text-secondary transition-colors z-[110] p-4">
        <span class="material-symbols-outlined text-[40px]">chevron_left</span>
    </button>
    
    <img id="lightbox-img" src="" alt="Fullscreen view" class="max-h-[85vh] max-w-[85vw] object-contain shadow-2xl" />
    
    <button onclick="nextImage(event)" class="absolute right-4 md:right-8 top-1/2 -translate-y-1/2 text-primary hover:text-secondary transition-colors z-[110] p-4">
        <span class="material-symbols-outlined text-[40px]">chevron_right</span>
    </button>
</div>

<script>
    let currentTab = 'ame_bleue';
    let currentIndex = 0;
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    function getImagesForTab(tab) {
        return Array.from(document.querySelectorAll('.gallery-img-' + tab)).map(img => img.src);
    }

    function switchTab(tabId) {
        currentTab = tabId;
        
        // Update Buttons
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('border-primary', 'text-primary');
            btn.classList.add('border-transparent', 'text-on-surface-variant');
        });
        const activeBtn = document.getElementById('tab-' + tabId);
        activeBtn.classList.remove('border-transparent', 'text-on-surface-variant');
        activeBtn.classList.add('border-primary', 'text-primary');

        // Update Grids
        document.querySelectorAll('.tab-pane').forEach(pane => {
            pane.classList.add('hidden');
        });
        document.getElementById('grid-' + tabId).classList.remove('hidden');
    }

    function openLightbox(tabId, index) {
        if (currentTab !== tabId) switchTab(tabId);
        currentIndex = index;
        const images = getImagesForTab(currentTab);
        lightboxImg.src = images[currentIndex];
        lightbox.classList.remove('hidden');
        void lightbox.offsetWidth;
        lightbox.classList.remove('opacity-0');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lightbox.classList.add('opacity-0');
        setTimeout(() => {
            lightbox.classList.add('hidden');
            document.body.style.overflow = '';
        }, 300);
    }

    function prevImage(e) {
        e.stopPropagation();
        const images = getImagesForTab(currentTab);
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        updateLightboxImage(images);
    }

    function nextImage(e) {
        e.stopPropagation();
        const images = getImagesForTab(currentTab);
        currentIndex = (currentIndex + 1) % images.length;
        updateLightboxImage(images);
    }
    
    function updateLightboxImage(images) {
        lightboxImg.style.opacity = 0;
        setTimeout(() => {
            lightboxImg.src = images[currentIndex];
            lightboxImg.style.opacity = 1;
        }, 150);
    }

    // Close on background click
    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) {
            closeLightbox();
        }
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (lightbox.classList.contains('hidden')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') prevImage(e);
        if (e.key === 'ArrowRight') nextImage(e);
    });
</script>
